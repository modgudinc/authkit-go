version: "2"

run:
  timeout: 5m
  tests: true
  # Lint the integration-tagged test files too, so issues there are gated by the
  # same `golangci-lint run` that CI and `make lint` use (non-tagged files are still
  # analyzed — build tags only add files).
  build-tags:
    - integration

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused

  settings:
    errcheck:
      check-type-assertions: true

formatters:
  enable:
    - gofmt
    - gofumpt
