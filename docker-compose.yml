name: authkit-go

services:
  postgres:
    # postgres:16-alpine, digest resolved 2026-10-13. The tag lets Dependabot stay on 16-alpine.
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: authkit-go-postgres
    environment:
      POSTGRES_DB: authkit_test
      POSTGRES_USER: authkit_test
      POSTGRES_PASSWORD: authkit_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authkit_test -d authkit_test"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - authkit_postgres_data:/var/lib/postgresql/data

volumes:
  authkit_postgres_data:
