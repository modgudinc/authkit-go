name: Branch Naming Convention

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore:
      - main
      - release

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Check branch naming convention
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"

          # Define allowed pattern
          PATTERN='^((feature|fix|bugfix|hotfix|docs|chore|test|refactor)/[a-z0-9][a-z0-9-]*[a-z0-9]|release/v[0-9]+(\.[0-9]+){1,2}|dependabot/.+|renovate/.+)$'

          # Check if main/release
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "release" ]]; then
            echo "Protected branch: $BRANCH_NAME"
            exit 0
          fi

          # Check pattern
          if [[ ! "$BRANCH_NAME" =~ $PATTERN ]]; then
            echo "Branch name '$BRANCH_NAME' does not match required pattern"
            echo ""
            echo "Required pattern: (feature|fix|bugfix|hotfix|docs|chore|test|refactor)/lowercase-with-dashes"
            echo "Release pattern: release/v1.2.3"
            echo ""
            echo "Valid examples:"
            echo "  - feature/add-schema-config"
            echo "  - fix/cache-warning"
            echo "  - bugfix/issue-123"
            echo "  - hotfix/critical-security"
            echo "  - release/v1.0.0"
            echo "  - docs/update-readme"
            echo "  - chore/update-deps"
            echo "  - refactor/token-rotation"
            exit 1
          fi

          echo "Branch name '$BRANCH_NAME' is valid"
