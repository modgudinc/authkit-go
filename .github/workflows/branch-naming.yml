name: Branch Naming Convention
permissions:
  contents: read
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore:
      - main

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"

          # Define allowed pattern: <type>/<lowercase alphanumeric with dashes>
          PATTERN='^(feature|fix|bugfix|hotfix|docs|chore|refactor)/[a-z0-9][a-z0-9-]*[a-z0-9]$'

          # Check if main
          if [[ "$BRANCH_NAME" == "main" ]]; then
            echo "✅ Protected branch: $BRANCH_NAME"
            exit 0
          fi

          # Dependabot manages its own branch names (dependabot/<ecosystem>/<dep>-<version>),
          # which don't fit the <type>/<dashes> convention — exempt them.
          if [[ "$BRANCH_NAME" == dependabot/* ]]; then
            echo "✅ Dependabot branch: $BRANCH_NAME"
            exit 0
          fi

          # Check pattern
          if [[ ! "$BRANCH_NAME" =~ $PATTERN ]]; then
            echo "❌ Branch name '$BRANCH_NAME' does not match required pattern"
            echo ""
            echo "Required pattern: (feature|fix|bugfix|hotfix|docs|chore|refactor)/lowercase-with-dashes"
            echo ""
            echo "Valid examples:"
            echo "  - feature/add-mcp-support"
            echo "  - fix/cache-warning"
            echo "  - bugfix/issue-123"
            echo "  - hotfix/critical-security"
            echo "  - docs/update-readme"
            echo "  - chore/update-deps"
            echo "  - refactor/token-rotation"
            exit 1
          fi

          echo "✅ Branch name '$BRANCH_NAME' is valid"
