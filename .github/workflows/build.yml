name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Toolchain info (debug)
        run: |
          go version
          go env GOVERSION GOTOOLCHAIN GOROOT GOFLAGS GOCACHE

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Enforce coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          threshold=20.0
          echo "Unit coverage: ${total}% (threshold ${threshold}%)"
          awk -v t="$total" -v th="$threshold" 'BEGIN { if (t+0 < th+0) { printf "FAIL: unit coverage %.1f%% is below threshold %.1f%%\n", t, th; exit 1 } }'

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.out

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # postgres:16-alpine, resolved 2026-06-10
        image: postgres@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_DB: authkit_test
          POSTGRES_USER: authkit_test
          POSTGRES_PASSWORD: authkit_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U authkit_test -d authkit_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    env:
      IDENTITY_TEST_DATABASE_URL: postgres://authkit_test:authkit_test@localhost:55432/authkit_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Toolchain info (debug)
        run: |
          go version
          go env GOVERSION GOTOOLCHAIN GOROOT GOFLAGS GOCACHE

      - name: Run integration tests
        run: go test -v -race -count=1 -tags=integration -coverpkg=./... -coverprofile=coverage.integration.out ./...

      - name: Enforce coverage threshold
        run: |
          total=$(go tool cover -func=coverage.integration.out | awk '/^total:/ {print $3}' | tr -d '%')
          threshold=50.0
          echo "Total coverage: ${total}% (threshold ${threshold}%)"
          awk -v t="$total" -v th="$threshold" 'BEGIN { if (t+0 < th+0) { printf "FAIL: coverage %.1f%% is below threshold %.1f%%\n", t, th; exit 1 } }'
