name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '24 9 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest

    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1
        with:
          go-version-file: go.mod
          go-package: ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    # security-events: write lets the SARIF be uploaded to GitHub code scanning so
    # findings surface in the Security tab; contents: read is restated because a
    # job-level permissions block replaces (not merges with) the workflow default.
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run gosec
        uses: securego/gosec@9e6a9843d7a4a6e3e9a8539b02612c8a4aa3f889 # v2.27.1
        with:
          # Explicit thresholds (report everything) so a future change to the action's
          # defaults can't silently relax the gate; emit SARIF for triage. gosec still
          # exits non-zero on findings, so the job fails — the SARIF is uploaded below
          # regardless via if: always().
          args: '-severity low -confidence low -fmt sarif -out gosec-results.sarif ./...'
      - name: Upload gosec SARIF report (artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gosec-sarif
          path: gosec-results.sarif
          if-no-files-found: warn
      - name: Upload gosec SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          sarif_file: gosec-results.sarif
          category: gosec
