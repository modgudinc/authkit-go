name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '24 9 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest

    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          # Scan with the latest Go release. The action ignores go-version-file
          # whenever go-version-input is set, and that input defaults to stable.
          go-version-input: stable
          go-package: ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    # security-events: write lets the SARIF be uploaded to GitHub code scanning so
    # findings surface in the Security tab; actions: read is required by
    # codeql-action/upload-sarif to look up the workflow run (private repos);
    # contents: read is restated because a job-level permissions block replaces
    # (not merges with) the workflow default.
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run gosec
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          # Explicit thresholds (report everything) so a future change to the action's
          # defaults can't silently relax the gate; emit SARIF for triage. gosec still
          # exits non-zero on findings, so the job fails — the SARIF is uploaded below
          # regardless via if: always().
          args: '-severity low -confidence low -fmt sarif -out gosec-results.sarif ./...'
      - name: Upload gosec SARIF report (artifact)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gosec-sarif
          path: gosec-results.sarif
          if-no-files-found: warn
      - name: Upload gosec SARIF to code scanning
        if: always()
        # Best-effort: gosec itself (the step above) is the gate. Surfacing findings in
        # the Security tab is a bonus, so a code-scanning hiccup (permissions, or
        # Advanced Security not enabled) must not red the gosec job. The SARIF is still
        # kept as a build artifact above.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: gosec-results.sarif
          category: gosec
