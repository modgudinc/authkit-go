version: 2
updates:
  # Go module dependencies. Security-sensitive transitive deps (golang-jwt, pgx,
  # golang.org/x/crypto) get automated update PRs; govulncheck (security.yml) gates
  # known-vulnerable versions, dependabot keeps them moving.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # Minor and patch bumps come as one PR; a major bump still gets its own.
      go-minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions are pinned by commit SHA in this repo; this bumps those pins.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # The digest-pinned Postgres image in docker-compose.yml. The same digest in
  # build.yml's service container is not covered: bump it by hand alongside.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
